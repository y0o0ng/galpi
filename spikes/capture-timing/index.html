<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>캡처 시간축 스파이크</title>
  <style>
    :root { --bg:#F3F5F2; --surface:#FAFBF9; --border:#D7DED9; --ink:#1D2622; --label:#5F6E66; --brand:#2F6B57; --danger:#FF3B30; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--ink); }
    header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
    button { min-height: 44px; padding: 0 14px; border: 1px solid var(--border); border-radius: 10px; background: #fff; font: inherit; color: var(--ink); }
    button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    button.on { background: #E2ECE7; border-color: var(--brand); }
    button:disabled { opacity: .4; }
    #status { margin-left: auto; font-weight: 600; }
    #status.recording { color: var(--danger); }
    #status.interrupted { color: #fff; background: var(--danger); padding: 6px 10px; border-radius: 10px; }
    #pad { display: block; width: 100%; height: 55vh; background: #fff; border-bottom: 1px solid var(--border); touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    header, #pad { -webkit-user-select: none; user-select: none; }
    main { padding: 12px 16px 40px; display: grid; gap: 16px; }
    section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
    h2 { margin: 0 0 8px; font-size: 15px; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    td, th { text-align: left; padding: 4px 6px; border-top: 1px solid var(--border); font-size: 13px; }
    #log { max-height: 200px; overflow: auto; font: 12px ui-monospace, monospace; color: var(--label); white-space: pre-wrap; }
    .muted { color: var(--label); }
    .pass { color: var(--brand); font-weight: 700; }
    .fail { color: var(--danger); font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <button id="btn-mic">마이크 준비</button>
    <button id="btn-rec" class="primary" disabled>녹음 시작</button>
    <button id="btn-pause" disabled>일시정지</button>
    <button id="btn-sync">싱크 탭 모드</button>
    <button id="btn-finish" disabled>측정 끝내기 · 분석</button>
    <span id="status">대기</span>
  </header>
  <canvas id="pad"></canvas>
  <main>
    <section>
      <h2>분석</h2>
      <div id="summary" class="muted">측정을 끝내면 여기에 결과가 나와.</div>
      <table id="taps"></table>
    </section>
    <section>
      <h2>저장된 기록 (복구)</h2>
      <div id="stored" class="muted">불러오는 중…</div>
    </section>
    <section>
      <h2>이벤트 로그 <button id="btn-export">로그 내보내기</button></h2>
      <div id="log"></div>
    </section>
  </main>
  <script src="analysis.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
