name: Docker

on:
  pull_request:
  push:
    branches:
      - main

# Action은 이동 가능한 태그가 아니라 **커밋 SHA로 고정**한다. 태그는 공격자가 옮길 수
# 있고 GitHub도 가장 강한 방식으로 SHA pinning을 안내한다. 뒤의 주석이 사람이 읽을
# 버전이고 Dependabot이 그 주석까지 함께 올려준다.
permissions:
  contents: read

jobs:
  native-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - run: npm test

  container-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha,scope=container-test
          cache-to: type=gha,mode=max,scope=container-test

  multi-platform-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=multi-platform
          cache-to: type=gha,mode=max,scope=multi-platform
