<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AI 의회">
  <title>AI 의회</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <header id="header">
      <div id="header-top">
        <span id="app-title">AI 의회</span>
        <div id="header-right">
          <span id="model-indicator"></span>
          <button id="theme-toggle" title="다크/라이트 모드 전환" aria-label="테마 전환">
            <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </button>
        </div>
      </div>
      <div id="toggle-row">
        <button class="model-btn active" data-model="claude">
          <img class="model-logo-icon" src="/lib/icons/sX8kIHSVvTDsFMiq9VQtQRczlnC6Ao5W6GvDvETovqQIJ1wxbLKydnVC-kBFsRoucWrclKkEW0ohQcJx3jm_pg.svg" width="22" height="22" aria-hidden="true">
          Claude
        </button>
        <button class="model-btn" data-model="gpt">
          <img class="model-logo-icon logo-gpt" src="/lib/icons/9yf4h0kNu7QBf_SABY4CQJ8IFmv9Kby2YRVNQADCntaBn8kQyiAMcGNT9JgMcI2Ec2NCqTTIx6eg9TZK7h1NbQ.svg" width="22" height="22" aria-hidden="true">
          GPT
        </button>
        <button class="council-btn disabled">의회</button>
        <div class="council-mode-toggle" aria-label="의회 답변 방식">
          <button class="mode-opt active" data-mode="compressed" title="1차 답변을 짧게 만들어 빠르고 저렴하게 종합합니다">빠름</button>
          <button class="mode-opt" data-mode="full" title="1차 답변을 압축하지 않고 일반 의회 방식으로 종합합니다">기본</button>
          <button class="mode-opt" data-mode="deep" title="상호 검토까지 수행해 더 꼼꼼하지만 느리고 비용이 더 듭니다">심층</button>
        </div>
      </div>
    </header>

    <div id="chat">
      <div id="messages"></div>
    </div>

    <div id="notes-bar" style="display:none"></div>

    <div id="command-palette" style="display:none"></div>

    <div id="input-area">
      <textarea id="input" placeholder="질문을 입력하세요… (Shift+Enter로 줄바꿈)" rows="1"></textarea>
      <button id="send-btn" title="전송 (Enter)">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>

  </div>
  <script src="lib/marked.min.js"></script>
  <script src="lib/purify.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
