<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="갈피">
  <meta name="theme-color" content="#F3F5F2">
  <title>갈피</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/lib/icons/Xion/xion-app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="/lib/icons/Xion/xion-app-icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/lib/icons/Xion/xion-app-icon-167.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <header id="header">
      <div id="header-top">
        <span id="model-indicator"></span>
        <div id="header-tools">
          <span id="web-usage-pill" class="header-pill web-usage-pill" title="외부 검색 사용량">Web off</span>
          <button id="knowledge-panel-toggle" title="지식 패널 열기" aria-label="지식 패널 열기" aria-expanded="false">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"></path>
            </svg>
          </button>
          <button id="theme-toggle" title="다크/라이트 모드 전환" aria-label="테마 전환">
            <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </button>
        </div>
      </div>
      <div id="toggle-row">
        <div class="model-btn model-chip active" aria-label="기본 답변 비서 XION">
          <span class="model-logo-icon xion-mark-icon" aria-hidden="true"></span>
          XION
        </div>
      </div>
    </header>

    <main id="workspace">
      <section id="chat-column" aria-label="AI 채팅">
        <div id="chat">
          <div id="messages"></div>
        </div>

        <div id="notes-bar" style="display:none"></div>

        <div id="command-palette" style="display:none"></div>

        <section id="voice-realtime-panel" aria-label="XION 실시간 음성 대화" hidden>
          <div class="voice-realtime-head">
            <div class="voice-realtime-presence" aria-hidden="true">
              <span></span><span></span><span></span>
            </div>
            <div class="voice-realtime-heading">
              <strong id="voice-realtime-status">대화 준비</strong>
              <span id="voice-realtime-model"></span>
            </div>
            <time id="voice-realtime-timer" aria-label="남은 음성 대화 시간"></time>
          </div>
          <div id="voice-realtime-transcript" aria-live="polite" aria-relevant="additions text"></div>
          <p id="voice-realtime-error" role="alert"></p>
          <div class="voice-realtime-actions">
            <span id="voice-realtime-disclosure" class="voice-realtime-disclosure">AI 생성 음성 · 저장 안 함</span>
            <button id="voice-realtime-mute" type="button" aria-pressed="false">음소거</button>
            <button id="voice-realtime-stop" type="button">종료</button>
          </div>
          <audio id="voice-realtime-audio" autoplay playsinline hidden></audio>
        </section>

        <section id="voice-hd-panel" aria-label="XION 음성 대화" hidden>
          <div class="voice-hd-head">
            <span id="voice-hd-dot" class="voice-hd-dot" aria-hidden="true"></span>
            <strong id="voice-hd-status">대화 준비</strong>
            <button id="voice-hd-stop" type="button">종료</button>
          </div>
          <div id="voice-hd-log" aria-live="polite" aria-relevant="additions text"></div>
          <p class="voice-hd-note">AI 생성 음성 · 시온이 말하는 동안에는 듣지 않아</p>
        </section>

        <div id="input-area">
          <div id="assistant-tools">
            <button id="assistant-tools-toggle" type="button" title="XION 도구" aria-label="XION 도구 열기" aria-controls="assistant-tools-menu" aria-expanded="false">
              <span class="assistant-tools-icon" aria-hidden="true"></span>
            </button>
            <nav id="assistant-tools-menu" aria-label="XION 도구" hidden></nav>
          </div>
          <div id="chat-model-control">
            <button id="chat-model-button" type="button" aria-haspopup="listbox" aria-controls="chat-model-menu" aria-expanded="false" disabled>
              <span id="chat-model-button-label">모델</span>
              <span class="chat-model-chevron" aria-hidden="true">⌄</span>
            </button>
            <section id="chat-model-menu" aria-label="답변 모델 선택" hidden>
              <div class="chat-model-menu-head">
                <strong>답변 모델</strong>
                <span>다음 답변부터</span>
              </div>
              <div id="chat-model-options" role="listbox" aria-label="GPT 모델"></div>
              <p id="chat-model-status" aria-live="polite"></p>
            </section>
          </div>
          <textarea id="input" placeholder="메시지를 입력하세요" rows="1"></textarea>
          <button id="voice-hd-button" type="button" title="XION 음성 대화" aria-label="XION 음성 대화 시작" aria-pressed="false" hidden>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect width="8" height="13" x="8" y="2" rx="4"></rect>
              <path d="M18 10a6 6 0 0 1-12 0"></path>
              <path d="M12 19v3"></path>
            </svg>
          </button>
          <button id="voice-realtime-button" type="button" title="XION 실시간 음성 대화" aria-label="XION 실시간 음성 대화 시작" aria-pressed="false" hidden>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect width="8" height="13" x="8" y="2" rx="4"></rect>
              <path d="M18 10a6 6 0 0 1-12 0"></path>
              <path d="M12 19v3"></path>
            </svg>
          </button>
          <button id="send-btn" title="전송 (Enter)">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </section>

      <aside id="knowledge-panel" aria-label="지식 패널">
        <div id="knowledge-panel-head">
          <nav id="knowledge-tabs" aria-label="지식 유형" role="tablist">
            <button class="knowledge-tab active" data-panel-tab="notifications" type="button" role="tab" aria-selected="true" aria-controls="notification-panel" title="알림센터">알림</button>
            <button class="knowledge-tab" data-panel-tab="notes" type="button" role="tab" aria-selected="false" aria-controls="note-panel">노트</button>
            <button class="knowledge-tab" data-panel-tab="agents" type="button" role="tab" aria-selected="false" aria-controls="agent-panel">에이전트</button>
            <button class="knowledge-tab" data-panel-tab="papers" type="button" role="tab" aria-selected="false" aria-controls="paper-panel">논문</button>
          </nav>
          <button id="knowledge-panel-close" type="button" title="지식 패널 닫기" aria-label="지식 패널 닫기">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m18 6-12 12"></path><path d="m6 6 12 12"></path></svg>
          </button>
        </div>

        <section id="notification-panel" class="knowledge-panel-view" role="tabpanel">
          <div class="notification-panel-head">
            <div>
              <span class="notification-kicker">XION</span>
              <strong class="notification-title">알림센터</strong>
            </div>
            <button id="notification-panel-refresh" class="notification-panel-refresh" type="button">새로고침</button>
          </div>
          <div class="notification-tabs" role="tablist" aria-label="알림 유형">
            <button class="notification-tab active" data-notification-filter="all" type="button" role="tab" aria-selected="true">전체</button>
            <button class="notification-tab" data-notification-filter="codex" type="button" role="tab" aria-selected="false">Codex</button>
            <button class="notification-tab" data-notification-filter="system" type="button" role="tab" aria-selected="false">시스템</button>
            <button class="notification-tab" data-notification-filter="saves" type="button" role="tab" aria-selected="false">최근 저장</button>
          </div>
          <div id="notification-panel-content" class="notification-body" aria-live="polite"></div>
        </section>

        <section id="note-panel" class="knowledge-panel-view" role="tabpanel" hidden>
          <form id="note-panel-search" role="search">
            <input id="note-panel-query" type="search" maxlength="200" placeholder="노트 제목 검색" autocomplete="off" aria-label="노트 제목 검색어">
            <button type="submit" title="노트 검색" aria-label="노트 검색">
              <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
            </button>
          </form>
          <div id="note-panel-content" aria-live="polite"></div>
        </section>

        <section id="agent-panel" class="knowledge-panel-view" role="tabpanel" hidden>
          <div id="agent-panel-content" aria-live="polite">
            <div class="panel-empty-state">준비 중</div>
          </div>
        </section>

        <section id="paper-panel" class="knowledge-panel-view" role="tabpanel" hidden>
          <form id="paper-panel-search" role="search">
            <input id="paper-panel-query" type="search" maxlength="200" placeholder="논문 검색" autocomplete="off" aria-label="논문 검색어">
            <button type="submit" title="논문 검색" aria-label="논문 검색">
              <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
            </button>
          </form>
          <div id="paper-panel-content" aria-live="polite"></div>
        </section>
      </aside>
    </main>
  </div>
  <div id="knowledge-panel-backdrop" hidden></div>
  <script src="lib/marked.min.js"></script>
  <script src="lib/purify.min.js"></script>
  <script src="note-panel.js"></script>
  <script src="notification-panel.js"></script>
  <script src="task-panel.js"></script>
  <script src="push-client.js"></script>
  <script src="agent-panel.js"></script>
  <script src="model-picker.js"></script>
  <script src="voice-turn-recorder.js"></script>
  <script src="voice-realtime.js"></script>
  <script src="voice-halfduplex.js"></script>
  <script src="voice-halfduplex-ui.js"></script>
  <script src="paper-panel.js"></script>
  <script src="app.js"></script>
</body>
</html>
